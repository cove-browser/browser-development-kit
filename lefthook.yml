# Hooks never start a Chromium build. CI repeats every check, so bypassing hooks gains nothing.
pre-commit:
  parallel: true
  commands:
    swift-format:
      glob: "*.swift"
      run: swift format --in-place {staged_files}
      stage_fixed: true
    clang-format:
      glob: "{packages,chromium/bdk}/**/*.{h,cc,mm}"
      run: clang-format -i {staged_files}
      stage_fixed: true
    biome:
      glob: "*.{ts,tsx,js,mjs,json,jsonc,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    toml:
      glob: "*.toml"
      run: taplo format {staged_files}
      stage_fixed: true
    shell:
      glob: "*.sh"
      run: shfmt -w {staged_files} && shellcheck {staged_files}
      stage_fixed: true
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}
    secrets:
      run: gitleaks git --staged --redact --no-banner
commit-msg:
  commands:
    conventional:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    affected-lint:
      run: pnpm exec nx affected -t lint
