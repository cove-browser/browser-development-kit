# swift-format owns layout. SwiftLint keeps semantic rules only.
included:
  - packages/swift
  - apps
excluded:
  - "**/.build"
  # Written by packages/js/codegen; swift-format skips it with an ignore marker.
  - "**/Generated"
disabled_rules:
  - line_length
  - trailing_whitespace
  - trailing_newline
  - trailing_comma
  - vertical_whitespace
  - opening_brace
  - statement_position
  - colon
  - comma
  - indentation_width
  - closing_brace
  - leading_whitespace
  - return_arrow_whitespace
  - operator_whitespace
  - control_statement
  - switch_case_alignment
  - sorted_imports
  - multiple_closures_with_trailing_closure
  # Flags String(decoding:as:), which is the non-optional conversion it recommends elsewhere.
  - optional_data_string_conversion
opt_in_rules:
  - force_unwrapping
  - explicit_init
  - empty_count
  - unused_import

# swift-api.md names `ID` types and the `ui` domain, and nests Navigation.Entry two deep. x and y are
# coordinates (window features, points).
identifier_name:
  excluded: [id, ui, x, y]
type_name:
  excluded: [ID]
nesting:
  type_level: 2
